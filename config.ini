[account]
; 统一身份认证学号
student_id = 
; 统一身份认证密码
password = 

[instrument]
; 要预约的设备序号：1-5（对应仪器列表顺序；2、3 是同名两台设备，见 README）
index = 5

[time]
; 开始时间随机区间（小时），格式：起,止
start_range = 8,9
; 结束时间随机区间（小时），格式：起,止
end_range = 18,23
; 当月预约总时长上限（小时）
monthly_budget = 200
; 全年预约目标（小时），用于在 booking_history.json 中统计差额
yearly_target = 1700

[date]
; 开始日期（当月几号），留空则运行时询问
start_day =
; 结束日期（当月几号），留空则运行时询问
end_day =

[ocr]
; 是否把每次验证码原图保存到 captcha_samples/（图片 + labels.jsonl 记录），
; 用于积累数据集（后续模板匹配或训练识别模型）；不需要时改为 false
save_samples = false
